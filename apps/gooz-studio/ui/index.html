<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>goozarap · sessions</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <header class="topbar">
      <div class="wordmark">gooza<span>rap</span><em>sessions</em></div>
      <!-- Always on screen: from a result, a mode is the way back to the mic. -->
      <div id="modes" class="modes" role="radiogroup" aria-label="what to do with the recording">
        <button class="mode is-on" role="radio" aria-checked="true" data-mode="hum">tararear</button>
        <button class="mode" role="radio" aria-checked="false" data-mode="instrument">mi instrumento</button>
        <button class="mode" role="radio" aria-checked="false" data-mode="style">sobre un estilo</button>
      </div>
      <div class="session-tag">SESSION <b>001</b></div>
    </header>

    <main class="stage">
      <!-- the mic: first run, and where every result goes back to -->
      <section id="intro" class="intro">
        <div id="styles" class="styles hidden" role="radiogroup" aria-label="style"></div>
        <p id="prompt" class="prompt">hum something<span class="cursor">_</span></p>
        <button id="recBtn" class="rec" aria-label="record">
          <span class="ring"></span>
          <span class="dot"></span>
          <span class="label">hum</span>
        </button>
        <p id="hint" class="hint">
          tap &amp; hum a melody — no theory, just a sound.
          <a href="#" id="demoLink">or hear a demo ▶</a>
        </p>
        <p id="introMsg" class="toast err hidden" role="alert"></p>
      </section>

      <!-- result -->
      <section id="result" class="result hidden">
        <h2 id="heard" class="heard">esto escuché</h2>
        <div id="notes" class="notes"></div>
        <div class="wavewrap">
          <canvas id="wave" width="1100" height="220"></canvas>
          <div id="barlabels" class="barlabels"></div>
        </div>
        <div class="controls">
          <button id="playBtn" class="btn play">▶ play loop</button>
          <button id="saveBtn" class="btn ghost">⤓ save session</button>
          <button id="exportBtn" class="btn ghost">◈ export wav</button>
          <button id="redoBtn" class="btn ghost">← volver</button>
          <span id="meta" class="meta"></span>
        </div>
        <p id="toast" class="toast hidden"></p>
      </section>
    </main>

    <footer class="sliders">
      <label class="slider"><span>smooth</span>
        <input id="tenseRng" type="range" min="0" max="100" value="30" class="rng cyan" /><span>tense</span>
      </label>
      <label class="slider"><span>sparse</span>
        <input id="busyRng" type="range" min="0" max="100" value="55" class="rng pink" /><span>busy</span>
      </label>
      <div class="beatbar">
        <button id="beatBtn" class="btn beat">▶ beat</button>
        <span id="beatLanes" class="beatlanes"></span>
      </div>
    </footer>

    <script src="fixture.js"></script>
    <script src="main.js"></script>
  </body>
</html>
